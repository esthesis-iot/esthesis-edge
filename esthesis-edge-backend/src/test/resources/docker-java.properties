# Testcontainers falls back to Docker Remote API 1.32 when no API version is
# configured (DockerClientProviderStrategy.getClientForConfig). Docker Engine 29+
# rejects anything below 1.40, which breaks every Testcontainers-backed test with
# "Could not find a valid Docker environment".
# 1.41 clears that floor and is still supported by Docker 20.10 and newer.
api.version=1.41
